# Nykaa Fashion — scheduled scrape + catalog refresh
# Every ~10 days (1st, 11th, 21st, 31st at 06:00 UTC). Also runnable from the Actions tab.
name: Ingest Classify Index Nykaa Fashion

on:
  schedule:
    - cron: "0 6 */10 * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to scrape (space-separated)"
        required: false
        default: "play_store app_store reddit"

concurrency:
  group: nykaa-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      PYTHONUNBUFFERED: "1"
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies (no torch)
        run: pip install -r requirements-ci.txt

      - name: Phase 0 check
        run: python -m src.phase0_check

      - name: Offline tests
        run: pytest tests/phase0 tests/ingestion -q

      - name: Phase 1 scrape
        id: ingest
        continue-on-error: true
        run: python -m src.ingestion --sources ${{ github.event.inputs.sources || 'play_store app_store reddit' }} --verbose

      - name: Classify, index, catalog
        if: steps.ingest.outcome == 'success'
        run: |
          set -euo pipefail
          STUB=()
          if [ -z "${GROQ_API_KEY:-}" ]; then
            STUB=(--stub)
            echo "GROQ_API_KEY unset — processing/generation use --stub"
          fi
          python -m src.processing "${STUB[@]}" --verbose
          python -m src.indexing --stub --verbose
          python -m src.retrieval --catalog --stub --verbose
          python -m src.generation "${STUB[@]}" --verbose

      - name: Write workflow run marker
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          DAY="$(date -u +%F)"
          TARGET="$(ls -1d data/raw/_logs/20* 2>/dev/null | sort | tail -1 || true)"
          if [ -z "${TARGET}" ]; then
            TARGET="data/raw/_logs/${DAY}"
            mkdir -p "${TARGET}"
          fi
          export TARGET
          python - <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone
          target = pathlib.Path(os.environ["TARGET"])
          payload = {
              "id": int(os.environ["GITHUB_RUN_ID"]),
              "status": "completed",
              "conclusion": os.environ.get("JOB_STATUS") or "unknown",
              "event": os.environ.get("GITHUB_EVENT_NAME") or "",
              "display_title": "Ingest Classify Index Nykaa Fashion",
              "created_at": os.environ.get("GITHUB_RUN_STARTED_AT") or "",
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "run_started_at": os.environ.get("GITHUB_RUN_STARTED_AT") or "",
              "html_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "head_branch": os.environ.get("GITHUB_REF_NAME") or "",
              "actor": os.environ.get("GITHUB_ACTOR") or "",
          }
          target.joinpath("workflow_run.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"wrote {target / 'workflow_run.json'}")
          PY

      - name: Commit logs and catalog
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/raw/_logs data/processed/_logs data/index/_logs data/retrieval/_logs data/responses || true
          if git diff --cached --quiet; then
            echo "No tracked artifact changes"
            exit 0
          fi
          git commit -m "chore: refresh Nykaa Fashion scrape ($(date -u +%F))"
          git pull --rebase origin main
          git push

      - name: Upload raw + catalog artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nykaa-batch-${{ github.run_id }}
          path: |
            data/raw/
            data/processed/_logs/
            data/responses/
          if-no-files-found: warn
          retention-days: 14
